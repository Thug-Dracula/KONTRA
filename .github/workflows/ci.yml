name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow syntax
        run: bash .github/scripts/check_workflows.sh
      - name: Workflow and release tests
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -m unittest discover -s tools/release -p 'test_*.py'
      # The oracle is the instrument every parity number is measured with, so its
      # own tests are not optional: a wrong MIDI writer or WAV reader makes every
      # comparison wrong in a way no gate row would see. Run here rather than in
      # the gate because they need no sample library, no display and no Kontakt.
      - name: Oracle tooling tests
        run: |
          python3 tools/test_oracle_mcp.py
          python3 -m unittest discover -s tools/oracle-mcp -p 'test_*.py'

  v3:
    uses: ./.github/workflows/v3-verify.yml

  required:
    name: CI required
    if: always()
    needs: [checks, v3]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          CHECKS: ${{ needs.checks.result }}
          V3: ${{ needs.v3.result }}
        run: |
          test "$CHECKS" = success
          test "$V3" = success
