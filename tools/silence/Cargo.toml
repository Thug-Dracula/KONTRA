[package]
name = "kontra-silence"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false
description = "Which link in a note's chain breaks, per instrument"

[lints]
workspace = true

[dependencies]
anyhow = "1"
kontra-engine = { path = "../../crates/engine/engine", features = ["trace"] }
kontra-host = { path = "../../crates/app/host" }
kontra-stream = { path = "../../crates/engine/stream" }
serde = { workspace = true }
serde_json = "1"
